[workspace]
members = [
    "crates/aethershift-protocol",
    "crates/aethershift-hyprland",
    "crates/aethershift-core",
    "crates/aethershift-daemon",
    "crates/aethershift-cli",
    "crates/aethershift-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["AetherShift Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
bytes = "1.10"
futures = "0.3"
